name: VPN Android and Windows build smoke

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'windows/**'
      - 'third_party/**'
      - 'scripts/provision-windows-native.ps1'
      - '.github/workflows/vpn-build-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Android K-Pax + X-Plm debug builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get
      - name: Build K-Pax Android (debug, unsigned for distribution)
        run: flutter build apk --debug --flavor kpaxDirect --dart-define=BRAND=kpax
      - name: Build X-Plm Android (debug, unsigned for distribution)
        run: flutter build apk --debug --flavor xplmDirect --dart-define=BRAND=xplm
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apks-unsigned-release
          path: |
            build/app/outputs/flutter-apk/app-kpaxdirect-debug.apk
            build/app/outputs/flutter-apk/app-xplmdirect-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows-build:
    name: Windows K-Pax + X-Plm release compilation (not production signed)
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - name: Download checksum-pinned native dependencies
        shell: pwsh
        run: ./scripts/provision-windows-native.ps1
      - name: Get packages
        run: flutter pub get
      - name: Build K-Pax Windows
        shell: pwsh
        run: |
          $env:APP_BRAND = 'kpax'
          flutter build windows --release --dart-define=BRAND=kpax
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'build/windows/x64/runner/Release/KPax.exe')) { throw 'Missing KPax.exe' }
      - name: Package K-Pax Windows test bundle (not signed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'artifacts/KPax-Windows-test.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: kpax-windows-unsigned-test
          path: artifacts/KPax-Windows-test.zip
          retention-days: 7
      - name: Build X-Plm Windows
        shell: pwsh
        run: |
          flutter clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:APP_BRAND = 'xplm'
          flutter build windows --release --dart-define=BRAND=xplm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'build/windows/x64/runner/Release/XPlm.exe')) { throw 'Missing XPlm.exe' }
      - name: Package X-Plm Windows test bundle (not signed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'artifacts/XPlm-Windows-test.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: xplm-windows-unsigned-test
          path: artifacts/XPlm-Windows-test.zip
          retention-days: 7
