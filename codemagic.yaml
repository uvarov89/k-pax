      - name: Validate exported X-Plm IPA and extension
        script: |
          set -e
          python3 ios/scripts/validate_ipa.py --brand xplm build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
