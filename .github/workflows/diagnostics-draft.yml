# DRAFT — collect sanitized diagnostics. No live prod SSH in Stage 1.
name: Diagnostics (draft — no live prod)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to collect (local CI logs only for now)'
        required: true
        default: 'ci-local-stub'
        type: choice
        options:
          - ci-local-stub
          - panel-sanitized  # reserved; blocked until deploy key exists

permissions:
  contents: read
  actions: read

jobs:
  diagnostics-stub:
    runs-on: ubuntu-latest
    # No production env required for stub; avoid burning approval queue.
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize stub report
        run: |
          set -euo pipefail
          echo "DRAFT diagnostics — no SSH to VPN nodes/panel."
          {
            echo "# Diagnostics stub $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "repo=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "scope=${{ inputs.scope }}"
            echo "NOTE: Redact tokens, keystore, panel config, passwords before sharing."
          } > diagnostics-stub.txt
          if [[ "${{ inputs.scope }}" == "panel-sanitized" ]]; then
            echo "::warning::panel-sanitized reserved; live collect not enabled. Stub only."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-stub
          path: diagnostics-stub.txt
          retention-days: 7
