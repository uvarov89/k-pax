workflows:
  ios-testflight:
    name: iOS TestFlight (K-Pax)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: kpax
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # UI: Application → Environment variables → group "code_signing"
      # with secure CERTIFICATE_PRIVATE_KEY (RSA PEM). No Mac required.
      groups:
        - code_signing
      vars:
        BRAND: kpax
        BUNDLE_ID: space.kpax.app
        BUNDLE_ID_EXT: space.kpax.app.extension
        APP_GROUP: group.space.kpax.app
        LIBBOX_SINGBOX_TAG: v1.13.21
        # Device arm64 only for TestFlight (simulator Cronet/x86_64 relink is optional).
        LIBBOX_APPLE_PLATFORM: ios
        LIBBOX_NORMALIZE_SLICES: device
      # Do not use environment.ios_signing here: it fails the build before
      # scripts can create missing App Store profiles (VPN / Network Extension).
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Libbox.xcframework
        script: |
          set -e
          brew install go || true
          export PATH="$PATH:$(go env GOPATH)/bin"
          chmod +x ios/scripts/build_libbox.sh
          ios/scripts/build_libbox.sh
      - name: Apply brand + Packet Tunnel target
        script: |
          set -e
          gem install xcodeproj --no-document
          ruby ios/scripts/apply_ios_brand.rb
          ruby ios/scripts/setup_packet_tunnel.rb
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --strict-match-identifier
          app-store-connect fetch-signing-files "$BUNDLE_ID_EXT" \
            --type IOS_APP_STORE \
            --create \
            --strict-match-identifier
          keychain add-certificates
          xcode-project use-profiles
      - name: Resolve TestFlight build number
        script: |
          set -e
          BUILD_NAME=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          if [ -n "${PROJECT_BUILD_NUMBER:-}" ]; then
            BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          else
            LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --app-store-version "$BUILD_NAME" 2>/dev/null || \
              app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
            case "$LATEST" in
              ''|*[!0-9]*) LATEST=0 ;;
            esac
            BUILD_NUMBER=$((LATEST + 1))
          fi
          echo "BUILD_NAME=$BUILD_NAME" >> "$CM_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
          echo "Using build $BUILD_NAME ($BUILD_NUMBER)"
      - name: Flutter build IPA
        script: |
          set -e
          flutter build ipa --release \
            --dart-define=BRAND=kpax \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Validate exported IPA and extension
        script: |
          set -e
          python3 ios/scripts/validate_ipa.py --brand kpax build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-testflight-xplm:
    name: iOS TestFlight (X-Plm)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: kpax
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - code_signing
      vars:
        BRAND: xplm
        BUNDLE_ID: online.xplm.app
        BUNDLE_ID_EXT: online.xplm.app.extension
        APP_GROUP: group.online.xplm.app
        LIBBOX_SINGBOX_TAG: v1.13.21
        LIBBOX_APPLE_PLATFORM: ios
        LIBBOX_NORMALIZE_SLICES: device
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Ensure X-Plm AppIcon set
        script: |
          set -e
          if [ ! -f ios/Runner/Assets.xcassets/AppIcon-Xplm.appiconset/Icon-App-1024x1024@1x.png ]; then
            python3 ios/scripts/gen_xplm_appicon.py
          fi
      - name: Build Libbox.xcframework
        script: |
          set -e
          brew install go || true
          export PATH="$PATH:$(go env GOPATH)/bin"
          chmod +x ios/scripts/build_libbox.sh
          ios/scripts/build_libbox.sh
      - name: Apply X-Plm brand + Packet Tunnel target
        script: |
          set -e
          gem install xcodeproj --no-document
          export BRAND=xplm
          ruby ios/scripts/apply_ios_brand.rb
          ruby ios/scripts/setup_packet_tunnel.rb
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --strict-match-identifier
          app-store-connect fetch-signing-files "$BUNDLE_ID_EXT" \
            --type IOS_APP_STORE \
            --create \
            --strict-match-identifier
          keychain add-certificates
          xcode-project use-profiles
      - name: Resolve TestFlight build number
        script: |
          set -e
          BUILD_NAME=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          if [ -n "${PROJECT_BUILD_NUMBER:-}" ]; then
            BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          else
            LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --app-store-version "$BUILD_NAME" 2>/dev/null || \
              app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
            case "$LATEST" in
              ''|*[!0-9]*) LATEST=0 ;;
            esac
            BUILD_NUMBER=$((LATEST + 1))
          fi
          echo "BUILD_NAME=$BUILD_NAME" >> "$CM_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
          echo "Using build $BUILD_NAME ($BUILD_NUMBER)"
      - name: Flutter build IPA (X-Plm)
        script: |
          set -e
