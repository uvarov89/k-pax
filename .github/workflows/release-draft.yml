# DRAFT — parametric release (Android/Windows). No live publish until secrets + approval ready.
# Guard: if: false keeps this from doing real work if triggered accidentally.
name: Release (draft — no live publish)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'android | windows | both'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - windows
          - both
      version:
        description: 'Version tag without v (e.g. 1.0.74). TODO: wire to pubspec.'
        required: true
        type: string
      dry_run:
        description: 'If true, build+sign only; never create GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Draft stub — blocked until Stage 2
        run: |
          echo "DRAFT workflow. Inputs: platform=${{ inputs.platform }} version=${{ inputs.version }} dry_run=${{ inputs.dry_run }}"
          echo "TODO: reuse android-sign-dry-run signing path; Windows unsigned or Trusted Signing."
          echo "TODO: only create release when dry_run=false AND environment approval granted."
          echo "::notice::Stub only — no artifacts published."
          # Hard stop so this never becomes an accidental publish path.
          if true; then
            echo "Exiting: draft stub (if: false style guard)."
            exit 0
          fi

  # Placeholder jobs — never run while needs: guard succeeds with no matrix work.
  android-release:
    if: false
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "TODO Android sign+optional gh release create"

  windows-release:
    if: false
    needs: guard
    runs-on: windows-2022
    environment: production
    steps:
      - run: echo "TODO Windows build; Authenticode TBD (WINDOWS_PFX_* or Azure Trusted Signing)"
