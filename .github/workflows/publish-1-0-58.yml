name: Publish K-Pax and X-Plm 1.0.58
on:
  push:
    branches:
      - release/v1.0.58
permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - name: Install verified sing-box and Wintun
        shell: pwsh
        run: ./scripts/provision-windows-native.ps1
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup unavailable' }
      - name: Build and package Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:APP_BRAND = 'kpax'
          flutter build windows --release --dart-define=BRAND=kpax
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc windows/installer/k-pax.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'build/windows/installer/K-Pax-Setup-1.0.58.exe')) { throw 'K-Pax installer missing' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item 'build/windows/installer/K-Pax-Setup-1.0.58.exe' artifacts/ -Force
          flutter clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:APP_BRAND = 'xplm'
          flutter build windows --release --dart-define=BRAND=xplm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc windows/installer/x-plm.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'build/windows/installer/X-Plm-Setup-1.0.58.exe')) { throw 'X-Plm installer missing' }
          Copy-Item 'build/windows/installer/X-Plm-Setup-1.0.58.exe' artifacts/ -Force
      - name: Publish both Windows releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = 'VPN DNS and tunnel reliability fixes. WARNING: legacy Windows firewall Kill switch was unsafe and is disabled in this version; do not rely on always-on leak protection.'
          gh release create 'v1.0.58-windows' 'artifacts/K-Pax-Setup-1.0.58.exe' --title 'K-Pax 1.0.58 Windows' --notes $notes --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create 'v1.0.58-xplm-windows' 'artifacts/X-Plm-Setup-1.0.58.exe' --title 'X-Plm 1.0.58 Windows' --notes $notes --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Prepare original release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Original Android signing credentials not present in GitHub Actions secrets; no Android release published."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties
      - name: Build signed K-Pax and X-Plm Android APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --flavor kpaxDirect --dart-define=BRAND=kpax
          flutter build apk --release --flavor xplmDirect --dart-define=BRAND=xplm
      - name: Enforce original signing certificates
        shell: bash
        run: |
          set -euo pipefail
          tool=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$tool"
          for brand in kpax xplm; do
            if [[ "$brand" = kpax ]]; then
              tag=v1.0.57; previous=K-Pax-1.0.57.apk
              current=build/app/outputs/flutter-apk/app-kpaxdirect-release.apk
            else
              tag=v1.0.57-xplm; previous=X-Plm-1.0.57.apk
              current=build/app/outputs/flutter-apk/app-xplmdirect-release.apk
            fi
            curl -fsSL --retry 3 -o "/tmp/$previous" "https://github.com/uvarov89/k-pax/releases/download/$tag/$previous"
            "$tool" verify --print-certs "/tmp/$previous" > /tmp/old.txt
            "$tool" verify --print-certs "$current" > /tmp/new.txt
            old=$(grep 'Signer #1 certificate SHA-256 digest' /tmp/old.txt | head -1)
            new=$(grep 'Signer #1 certificate SHA-256 digest' /tmp/new.txt | head -1)
            if [[ -z "$old" || -z "$new" || "$old" != "$new" ]]; then
              echo "::error::Android signing certificate mismatch ($brand). Refusing publication."
              exit 1
            fi
          done
      - name: Publish both Android releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-kpaxdirect-release.apk K-Pax-1.0.58.apk
          cp build/app/outputs/flutter-apk/app-xplmdirect-release.apk X-Plm-1.0.58.apk
          gh release create v1.0.58 K-Pax-1.0.58.apk --title 'K-Pax 1.0.58 Android' --notes 'Android VPN DNS compatibility, routing and connection verification fixes.' --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --latest=false
          gh release create v1.0.58-xplm X-Plm-1.0.58.apk --title 'X-Plm 1.0.58 Android' --notes 'Android VPN DNS compatibility, routing and connection verification fixes.' --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --latest=false
