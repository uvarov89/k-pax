# Controlled panel deploy of allowlisted server files via kpax-ci deploy-install.
# Requires production Environment approval. No arbitrary root shell.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to proceed'
        required: true
        type: string
      paths:
        description: 'Comma paths under server/ (default: panel.py)'
        required: false
        default: 'panel.py'
        type: string
      restart:
        description: 'Restart k-pax after deploy'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: kpax-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Confirm
        run: |
          [[ "${{ inputs.confirm }}" == "DEPLOY" ]] || {
            echo "::error::Type DEPLOY to confirm"
            exit 1
          }

      - name: Validate allowlist
        id: val
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          mkdir -p stage
          names=()
          IFS=',' read -ra items <<< "$PATHS"
          for p in "${items[@]}"; do
            p="$(echo "$p" | xargs)"
            [[ -n "$p" ]] || continue
            if [[ "$p" == */* || "$p" == .* ]]; then
              echo "::error::path not allowlisted: $p"
              exit 1
            fi
            [[ "$p" == *.py ]] || { echo "::error::only .py under server/: $p"; exit 1; }
            src="server/$p"
            [[ -f "$src" ]] || { echo "::error::missing $src"; exit 1; }
            if grep -Eiq 'BEGIN (RSA |OPENSSH |)PRIVATE KEY|password\s*=\s*["'\''][^"'\'']{8,}' "$src"; then
              echo "::error::refusing secret-bearing file: $src"
              exit 1
            fi
            python3 -m py_compile "$src"
            cp "$src" "stage/$p"
            names+=("$p")
            echo "validated $p"
          done
          echo "files=${names[*]}" >> "$GITHUB_OUTPUT"
          ls -la stage/

      - name: Setup SSH
        env:
          KPAX_DEPLOY_SSH_KEY: ${{ secrets.KPAX_DEPLOY_SSH_KEY }}
          KPAX_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.KPAX_DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash tools/ci/ssh_setup.sh

      - name: Stage + kpax-ci deploy-install
        env:
          PANEL: ${{ secrets.KPAX_DEPLOY_HOST }}
          RESTART: ${{ inputs.restart }}
          FILES: ${{ steps.val.outputs.files }}
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          SCP=(scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          CI=/usr/local/lib/kpax-ci/kpax-ci
          stamp=$(date -u +%Y%m%dT%H%MZ)
          "${SSH[@]}" "gha@${PANEL}" 'rm -rf /tmp/kpax-ci-stage && mkdir -m 700 /tmp/kpax-ci-stage'
          for f in stage/*; do
            base=$(basename "$f")
            "${SCP[@]}" "$f" "gha@${PANEL}:/tmp/kpax-ci-stage/$base"
            echo "staged $base"
          done
          # shellcheck disable=SC2086
          "${SSH[@]}" "gha@${PANEL}" "sudo $CI deploy-install $stamp $FILES" | tee deploy-install.txt
          if [[ "$RESTART" == "true" ]]; then
            "${SSH[@]}" "gha@${PANEL}" "sudo $CI restart k-pax"
            sleep 3
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "https://k-pax.space/healthz" || true)
          code=${code:-err}
          echo "healthz=$code"
          case "$code" in
            200|204) ;;
            *) echo "FAIL healthz code=$code"; exit 1 ;;
          esac
          echo "deploy_ok stamp=$stamp files=$FILES" | tee deploy-result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ github.run_id }}
          path: |
            deploy-result.txt
            deploy-install.txt
          retention-days: 30
