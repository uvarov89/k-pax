# DRAFT — SSH deploy to panel/nodes. Does NOT run against production.
# Requires a NEW limited deploy key (NOT owner ~/.ssh/k-pax_ed25519).
# Secret names (to create later, Environment production):
#   KPAX_DEPLOY_SSH_KEY   — private key for deploy-only account
#   KPAX_DEPLOY_SSH_KNOWN_HOSTS — known_hosts for panel (+ optional exits)
#   KPAX_DEPLOY_HOST      — optional override (default documented host alias IP)
name: Deploy (draft — no live SSH)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'panel | docs-only-stub'
        required: true
        default: 'docs-only-stub'
        type: choice
        options:
          - docs-only-stub
          - panel
      ref_note:
        description: 'What would be deployed (path/ref) — informational only'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-stub:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Document-only deploy stub
        env:
          HAS_DEPLOY_KEY: ${{ secrets.KPAX_DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.KPAX_DEPLOY_SSH_KNOWN_HOSTS != '' }}
        run: |
          set -euo pipefail
          echo "DRAFT deploy workflow — no SSH executed."
          echo "target=${{ inputs.target }} note=${{ inputs.ref_note }}"
          echo "KPAX_DEPLOY_SSH_KEY present: ${HAS_DEPLOY_KEY}"
          echo "KPAX_DEPLOY_SSH_KNOWN_HOSTS present: ${HAS_KNOWN_HOSTS}"
          echo "::notice::Owner must create a NEW limited deploy key (not personal ops key), install pubkey on panel only when ready, then set env secrets."
          if [[ "${{ inputs.target }}" != "docs-only-stub" ]]; then
            echo "::error::Live panel deploy is disabled in this draft. Use docs-only-stub."
            exit 1
          fi
          # Never open SSH here.
          if false; then
            # TODO (Stage 2+):
            # - install key from KPAX_DEPLOY_SSH_KEY into $HOME/.ssh/id_deploy
            # - write known_hosts from KPAX_DEPLOY_SSH_KNOWN_HOSTS
            # - scp only allowlisted paths (e.g. panel.py) — never config.json / backup.pass
            # - systemctl restart k-pax on panel only after approval
            true
          fi
