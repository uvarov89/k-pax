workflows:
  ios-testflight:
    name: iOS TestFlight (K-Pax)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: kpax
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: space.kpax.app
        BUNDLE_ID_EXT: space.kpax.app.extension
        LIBBOX_SINGBOX_TAG: v1.12.12
      ios_signing:
        distribution_type: app_store
        bundle_identifier: space.kpax.app,space.kpax.app.extension
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Libbox.xcframework
        script: |
          set -e
          brew install go || true
          export PATH="$PATH:$(go env GOPATH)/bin"
          chmod +x ios/scripts/build_libbox.sh
          ios/scripts/build_libbox.sh
      - name: Add Packet Tunnel target
        script: |
          set -e
          gem install xcodeproj --no-document
          ruby ios/scripts/setup_packet_tunnel.rb
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Flutter build IPA
        script: |
          set -e
          BUILD_NAME=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //;s/+.*//')
          BUILD_NUMBER=${PROJECT_BUILD_NUMBER:-$(date +%Y%m%d%H%M)}
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
