# Restore previous server tree via kpax-ci rollback. Requires production approval.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROLLBACK to proceed'
        required: true
        type: string
      backup_name:
        description: 'Backup dir name under /var/backups/k-pax-ci (empty = latest pre-deploy-*)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: kpax-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Confirm
        run: |
          [[ "${{ inputs.confirm }}" == "ROLLBACK" ]] || {
            echo "::error::Type ROLLBACK to confirm"
            exit 1
          }

      - name: Setup SSH
        env:
          KPAX_DEPLOY_SSH_KEY: ${{ secrets.KPAX_DEPLOY_SSH_KEY }}
          KPAX_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.KPAX_DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash tools/ci/ssh_setup.sh

      - name: kpax-ci rollback
        env:
          PANEL: ${{ secrets.KPAX_DEPLOY_HOST }}
          BACKUP_NAME: ${{ inputs.backup_name }}
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          CI=/usr/local/lib/kpax-ci/kpax-ci
          if [[ -n "$BACKUP_NAME" ]]; then
            # basename only
            case "$BACKUP_NAME" in
              *[!a-zA-Z0-9._-]*) echo "::error::bad backup name"; exit 1 ;;
            esac
            "${SSH[@]}" "gha@${PANEL}" "sudo $CI rollback $BACKUP_NAME" | tee rollback-result.txt
          else
            "${SSH[@]}" "gha@${PANEL}" "sudo $CI rollback" | tee rollback-result.txt
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "https://k-pax.space/healthz" || true)
          echo "healthz=$code"
          case "$code" in
            200|204) ;;
            *) echo "FAIL healthz"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ github.run_id }}
          path: rollback-result.txt
          retention-days: 30
